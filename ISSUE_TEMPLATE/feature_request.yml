name: Feature request
description: Suggest something OpenMeshTak should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation at your event or in your integration.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
